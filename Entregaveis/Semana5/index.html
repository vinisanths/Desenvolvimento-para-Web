<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objetos, Dados e Assincronismo</title>
</head>
<body>

    <h1>Mini Projeto: Buscador de CEP</h1>

    <form id="formulario-cep">
        <label for="cep">Digite o CEP:</label>
        <input type="text" id="cep" name="cep">

        <button type="submit" id="botao-buscar">Buscar</button>
    </form>

    <p id="status"></p>

    <dl id="resultado"></dl>

    <h2>Histórico de CEPs</h2>
    <ul id="historico"></ul>

    <hr>

    <h1>Mini Pokédex</h1>

    <form id="formulario-pokemon">
        <label for="pokemon">Digite o nome do Pokémon:</label>
        <input type="text" id="pokemon" name="pokemon">

        <button type="submit" id="botao-pokemon">Buscar</button>
    </form>

    <p id="status-pokemon"></p>

    <div id="resultado-pokemon"></div>

    <script src="app.js"></script>
</body>
</html>
